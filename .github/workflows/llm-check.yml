# Runs the live OpenRouter checks (src/llm/live.test.ts) on a runner with internet access.
# The key is taken from a dispatch input, masked in logs, and never written to the repo.
# Delete the workflow run afterwards if you do not want the input kept in run history.
name: LLM live check

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'OpenRouter model id'
        required: true
        default: 'deepseek/deepseek-v4.1-flash'
      api_key:
        description: 'OpenRouter API key (masked in logs)'
        required: true

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Mask the key in logs
        env:
          KEY: ${{ inputs.api_key }}
        run: echo "::add-mask::$KEY"
      - name: Live tests
        env:
          OPENROUTER_API_KEY: ${{ inputs.api_key }}
          OPENROUTER_MODEL: ${{ inputs.model }}
        run: npx vitest run src/llm/live.test.ts --reporter=verbose
