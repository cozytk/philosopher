# Runs the live OpenRouter checks (src/llm/live.test.ts) on a runner with internet access.
# The key comes from the repository secret OPENROUTER_API_KEY, which GitHub masks everywhere:
#   gh secret set OPENROUTER_API_KEY -R cozytk/philosopher
# Never pass keys as workflow inputs: GitHub prints step env blocks in the log before any mask applies.
name: LLM live check

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'OpenRouter model id'
        required: true
        default: 'deepseek/deepseek-v4.1-flash'

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Require the secret
        env:
          HAS_KEY: ${{ secrets.OPENROUTER_API_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error::Repository secret OPENROUTER_API_KEY is not set. Run: gh secret set OPENROUTER_API_KEY -R ${{ github.repository }}"
            exit 1
          fi
      - name: Live tests
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ inputs.model }}
        run: npx vitest run src/llm/live.test.ts --reporter=verbose
